name: Responsive Visual QA

on:
  push:
    branches:
      - qa/responsive-visual-pass

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install project dependencies
        run: npm install --no-audit --no-fund

      - name: Repository checks
        run: npm run check

      - name: Build production bundle
        run: npm run build

      - name: Install Playwright browser
        run: |
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps chromium

      - name: Start local production server
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/afaaq-next.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/afaaq-next.log
          exit 1

      - name: Audit responsive UI
        env:
          QA_BASE_URL: http://127.0.0.1:3000
        run: node scripts/responsive-qa.mjs

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-qa-evidence-local
          path: qa-artifacts
          if-no-files-found: error
          retention-days: 1
