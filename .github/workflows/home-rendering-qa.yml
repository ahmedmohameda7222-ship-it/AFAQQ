name: Home Rendering QA

on:
  push:
    branches:
      - fix/home-rendering

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm run build
      - name: Verify rendered Home
        run: |
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
          npm run start > /tmp/afaaq-next.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:3000 >/dev/null && break
            sleep 1
          done
          cat > home-render-qa.mjs <<'EOF'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1366, height: 768 } });
          await page.goto('http://127.0.0.1:3000', { waitUntil: 'networkidle' });
          const result = await page.evaluate(() => {
            const img = [...document.images].find(image => image.alt === 'High-voltage electrical substation at blue hour.');
            const hero = img?.parentElement;
            const heroRect = hero?.getBoundingClientRect();
            const imgRect = img?.getBoundingClientRect();
            const sections = [...document.querySelectorAll('main > section')];
            const hiddenSections = sections.filter(section => {
              const child = section.firstElementChild;
              if (!child) return false;
              const style = getComputedStyle(child);
              return Number(style.opacity) === 0 || style.visibility === 'hidden';
            }).length;
            return {
              heroRect: heroRect && { width: heroRect.width, height: heroRect.height },
              imgRect: imgRect && { width: imgRect.width, height: imgRect.height },
              natural: img && { width: img.naturalWidth, height: img.naturalHeight },
              hiddenSections,
            };
          });
          console.log(JSON.stringify(result, null, 2));
          if (!result.heroRect || !result.imgRect) process.exit(1);
          if (Math.abs(result.heroRect.height - result.imgRect.height) > 2) process.exit(1);
          if (Math.abs(result.heroRect.width - result.imgRect.width) > 2) process.exit(1);
          if (!result.natural || result.natural.width === 0 || result.natural.height === 0) process.exit(1);
          if (result.hiddenSections !== 0) process.exit(1);
          await page.screenshot({ path: 'home-rendering.png', fullPage: true });
          await browser.close();
          EOF
          node home-render-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: home-rendering-qa
          path: home-rendering.png
          retention-days: 1
