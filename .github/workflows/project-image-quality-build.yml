name: Validate project image quality fix

on:
  push:
    branches:
      - qa/project-image-quality-build

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install and validate
        run: |
          npm install --no-audit --no-fund
          npm run check
          npm run build
      - name: Confirm unsupported quality override is gone
        run: |
          ! grep -Fq 'quality={82}' src/components/afaaq/project-media.tsx
