name: Home Live Visual QA

on:
  push:
    branches:
      - qa/home-live-visual

permissions:
  contents: read

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
      - name: Capture production Home
        run: |
          mkdir -p qa-home
          cat > home-qa.mjs <<'EOF'
          import { chromium } from 'playwright';
          import { writeFile } from 'node:fs/promises';
          const cases = [
            ['mobile',390,844],
            ['tablet',768,1024],
            ['laptop',1366,768],
            ['desktop',1920,1080],
          ];
          const browser = await chromium.launch({headless:true});
          const report=[];
          for (const [name,width,height] of cases) {
            const context = await browser.newContext({viewport:{width,height}});
            const page = await context.newPage();
            const failures=[];
            page.on('pageerror', e=>failures.push(`pageerror: ${e.message}`));
            page.on('response', r=>{if(r.status()>=400) failures.push(`${r.status()} ${r.url()}`)});
            const response = await page.goto('https://affag.vercel.app',{waitUntil:'networkidle',timeout:60000});
            if (!response || response.status()>=400) failures.push(`route status ${response?.status()}`);
            const data = await page.evaluate(() => {
              const doc=document.documentElement;
              const img=document.querySelector('img[alt="High-voltage substation at blue hour with switchgear, busbars and transmission infrastructure."]');
              const ctas=[...document.querySelectorAll('a')].filter(a=>/Discuss a Project Scope|View Our Projects/.test(a.textContent||''));
              const r=img?.getBoundingClientRect();
              return {
                overflow:doc.scrollWidth-doc.clientWidth,
                imageFound:!!img,
                imageRect:r?{x:r.x,y:r.y,width:r.width,height:r.height}:null,
                imageNatural:img?{width:img.naturalWidth,height:img.naturalHeight}:null,
                ctaRects:ctas.slice(0,2).map(a=>{const b=a.getBoundingClientRect();return {text:(a.textContent||'').trim(),x:b.x,y:b.y,width:b.width,height:b.height}}),
                viewport:{width:innerWidth,height:innerHeight},
              };
            });
            if (data.overflow>1) failures.push(`horizontal overflow ${data.overflow}px`);
            if (!data.imageFound) failures.push('home image missing');
            await page.screenshot({path:`qa-home/${name}.png`,fullPage:true});
            report.push({name,data,failures});
            await context.close();
          }
          await browser.close();
          await writeFile('qa-home/report.json',JSON.stringify(report,null,2));
          console.log(JSON.stringify(report,null,2));
          if(report.some(r=>r.failures.length)) process.exit(1);
          EOF
          node home-qa.mjs
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: home-live-visual-qa
          path: qa-home
          retention-days: 1
