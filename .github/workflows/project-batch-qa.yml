name: Project Batch QA

on:
  push:
    branches:
      - content/project-images-rcc-about

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Repository checks
        run: npm run check
      - name: Production build
        run: npm run build
      - name: Install Playwright
        run: |
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
      - name: Start production server
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/afaaq.log 2>&1 &
          for i in {1..30}; do
            curl --fail --silent http://127.0.0.1:3000/projects > /dev/null && exit 0
            sleep 1
          done
          cat /tmp/afaaq.log
          exit 1
      - name: Responsive project and about QA
        run: node scripts/project-batch-qa.mjs
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-batch-qa
          path: qa-artifacts
          if-no-files-found: warn
          retention-days: 1
