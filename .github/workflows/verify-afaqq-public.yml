name: Verify AFAQQ public production

on:
  push:
    branches:
      - qa/verify-afaqq-public

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Home and About markers
        run: |
          set -euo pipefail
          home="$(curl -fsSL --retry 3 --retry-delay 2 https://afaqq-affaq.vercel.app/)"
          about="$(curl -fsSL --retry 3 --retry-delay 2 https://afaqq-affaq.vercel.app/about)"
          echo "home_image=$(echo "$home" | grep -Fq "High-voltage substation at blue hour" && echo yes || echo no)"
          echo "about_150=$(echo "$about" | grep -Fq "150+" && echo yes || echo no)"
          echo "about_60=$(echo "$about" | grep -Fq "60%" && echo yes || echo no)"
          echo "home_title=$(echo "$home" | sed -n 's:.*<title>\(.*\)</title>.*:\1:p' | head -1)"
          echo "about_title=$(echo "$about" | sed -n 's:.*<title>\(.*\)</title>.*:\1:p' | head -1)"
