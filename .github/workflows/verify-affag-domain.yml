name: Verify affag production domain

on:
  push:
    branches:
      - qa/verify-affag-domain

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect production HTML
        run: |
          set -euo pipefail
          html="$(curl -fsSL --retry 3 --retry-delay 2 https://affag.vercel.app/)"
          echo "image_marker=$(echo "$html" | grep -Fq "High-voltage substation at blue hour" && echo yes || echo no)"
          echo "substations_150=$(echo "$html" | grep -Fq "150+" && echo yes || echo no)"
          echo "eetc_60=$(echo "$html" | grep -Fq "60%" && echo yes || echo no)"
          echo "old_placeholder=$(echo "$html" | grep -Fq "hero-media-placeholder" && echo yes || echo no)"
          echo "title=$(echo "$html" | sed -n 's:.*<title>\(.*\)</title>.*:\1:p' | head -1)"
