name: Verify live project JPGs

on:
  push:
    branches:
      - qa/verify-live-project-jpgs

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify production project images
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow
          home="$(curl -fsSL --retry 5 --retry-all-errors https://afaqq-affaq.vercel.app/)"
          ! printf '%s' "$home" | grep -Fq 'q=82'
          printf '%s' "$home" | grep -Fq 'q=75'
          for name in drcc crcc rcc benban; do
            printf '%s' "$home" | grep -Fq "${name}.jpg"
            curl -fsSL --retry 5 --retry-all-errors "https://afaqq-affaq.vercel.app/images/projects/${name}.jpg" -o "/tmp/${name}-static.jpg"
            curl -fsSL --retry 5 --retry-all-errors "https://afaqq-affaq.vercel.app/_next/image?url=%2Fimages%2Fprojects%2F${name}.jpg&w=1080&q=75" -o "/tmp/${name}-optimized"
          done
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          for name in ['drcc', 'crcc', 'rcc', 'benban']:
              for kind, path in [('static', Path(f'/tmp/{name}-static.jpg')), ('optimized', Path(f'/tmp/{name}-optimized'))]:
                  assert path.exists() and path.stat().st_size > 0
                  with Image.open(path) as image:
                      image.load()
                      print(f'{name} {kind}: {image.format} {image.size} {path.stat().st_size/1024:.1f} KB')
          PY
