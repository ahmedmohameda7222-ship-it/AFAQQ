name: PR 10 Validation

on:
  push:
    branches:
      - content/project-portfolio-corrections

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run repository checks
        run: npm run check
      - name: Build production bundle
        run: npm run build
