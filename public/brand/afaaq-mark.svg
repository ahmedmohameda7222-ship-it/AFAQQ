<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" role="img" aria-labelledby="title desc">
  <title id="title">AFAAQ ARAB mark</title>
  <desc id="desc">Approved AFAAQ ARAB geometric A mark with blue sweep.</desc>
  <defs>
    <linearGradient id="aFill" x1="310" y1="930" x2="1080" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#061d58"/>
      <stop offset="0.5" stop-color="#0a2f82"/>
      <stop offset="1" stop-color="#073b9f"/>
    </linearGradient>
    <linearGradient id="sweepFill" x1="300" y1="760" x2="1170" y2="490" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0872ee"/>
      <stop offset="0.55" stop-color="#0b8cff"/>
      <stop offset="1" stop-color="#12a2ff"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
